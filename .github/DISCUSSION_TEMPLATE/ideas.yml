title: "Idea"
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        Use this discussion for early ideas about information architecture, examples, copy, or documentation UX before turning them into scoped issues.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Describe the idea directly.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: Explain the confusion or friction it addresses.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Note any design, maintenance, or content concerns.
